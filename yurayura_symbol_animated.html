<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ゆらゆら — シンボルアニメーション</title>
<style>
  :root{
    --bg:#f7f6f2;
    --ink:#232323;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg)}
  body{
    min-height:100svh;
    display:grid;
    place-items:center;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:min(92vw,900px);
    aspect-ratio:1;
    display:grid;
    place-items:center;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
  }
  @media (prefers-reduced-motion: reduce){
    canvas{filter:none}
  }
</style>
</head>
<body>
<main class="stage" aria-label="ゆらゆら アニメーションシンボル">
  <canvas id="yurayura"></canvas>
  <noscript>このシンボルアニメーションを表示するにはJavaScriptを有効にしてください。</noscript>
</main>

<script>
(() => {
  const canvas = document.getElementById('yurayura');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);

  function resize(){
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width * DPR);
    canvas.height = Math.round(r.height * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize', resize);
  resize();

  const TAU = Math.PI * 2;

  // Smoothstep: 帯の太さが突然切り替わらないようにする
  const smooth = x => x*x*(3-2*x);

  // 円周上を移動する「太い部分」を作る周期関数
  function lobe(a, center, width){
    let d = Math.atan2(Math.sin(a-center), Math.cos(a-center));
    const x = Math.max(0, 1 - Math.abs(d)/width);
    return smooth(x);
  }

  function ribbonPath(cx, cy, baseR, phase, t, cfg){
    const N = 360;
    const outer = [];
    const inner = [];

    for(let i=0;i<=N;i++){
      const a = i/N * TAU;

      // 「完全な円」にしない。複数周期を重ねてごく弱く歪ませる
      const wobble =
        cfg.w1 * Math.sin(a*2 + phase + t*cfg.speed1) +
        cfg.w2 * Math.sin(a*3 - phase*0.7 - t*cfg.speed2) +
        cfg.w3 * Math.sin(a*5 + 1.2 + t*cfg.speed3);

      // 偏心。外円・内円で位相と速度を変える
      const ox =
        cfg.offsetX +
        Math.sin(t*cfg.offsetSpeed + phase) * cfg.offsetAmp;
      const oy =
        cfg.offsetY +
        Math.cos(t*cfg.offsetSpeed*0.83 + phase) * cfg.offsetAmp*0.8;

      // 円周上を移動する「厚い帯」
      const thick =
        cfg.minWidth +
        cfg.maxAdd1 * lobe(a, cfg.lobe1 + t*cfg.lobeSpeed1, cfg.lobeWidth1) +
        cfg.maxAdd2 * lobe(a, cfg.lobe2 - t*cfg.lobeSpeed2, cfg.lobeWidth2);

      const r = baseR + wobble;
      const nx = Math.cos(a), ny = Math.sin(a);

      // 帯の外周・内周
      const ro = r + thick*0.5;
      const ri = r - thick*0.5;

      outer.push([cx+ox+ro*nx, cy+oy+ro*ny]);
      inner.push([cx+ox+ri*nx, cy+oy+ri*ny]);
    }

    const p = new Path2D();
    p.moveTo(...outer[0]);
    for(let i=1;i<outer.length;i++) p.lineTo(...outer[i]);
    for(let i=inner.length-1;i>=0;i--) p.lineTo(...inner[i]);
    p.closePath();

    // 中心線（細い輪郭）
    const c = new Path2D();
    for(let i=0;i<=N;i++){
      const a = i/N*TAU;
      const wobble =
        cfg.w1 * Math.sin(a*2 + phase + t*cfg.speed1) +
        cfg.w2 * Math.sin(a*3 - phase*0.7 - t*cfg.speed2) +
        cfg.w3 * Math.sin(a*5 + 1.2 + t*cfg.speed3);
      const ox =
        cfg.offsetX +
        Math.sin(t*cfg.offsetSpeed + phase) * cfg.offsetAmp;
      const oy =
        cfg.offsetY +
        Math.cos(t*cfg.offsetSpeed*0.83 + phase) * cfg.offsetAmp*0.8;
      const r = baseR+wobble;
      const x = cx+ox+r*Math.cos(a);
      const y = cy+oy+r*Math.sin(a);
      if(i===0)c.moveTo(x,y); else c.lineTo(x,y);
    }
    return {band:p, center:c};
  }

  const outerCfg = {
    w1:5.2,w2:2.6,w3:1.3,
    speed1:.12,speed2:.09,speed3:.07,
    offsetX:0,offsetY:-1,offsetAmp:3.2,offsetSpeed:.16,
    minWidth:.8,
    maxAdd1:22,maxAdd2:8,
    lobe1:.15,lobe2:3.75,
    lobeSpeed1:.18,lobeSpeed2:.11,
    lobeWidth1:1.15,lobeWidth2:.75
  };

  const innerCfg = {
    w1:3.8,w2:2.0,w3:1.0,
    speed1:-.10,speed2:.07,speed3:-.06,
    offsetX:2.2,offsetY:1.8,offsetAmp:2.5,offsetSpeed:.13,
    minWidth:.7,
    maxAdd1:16,maxAdd2:6,
    lobe1:1.05,lobe2:4.55,
    lobeSpeed1:.145,lobeSpeed2:.095,
    lobeWidth1:.95,lobeWidth2:.65
  };

  function paintRibbon(pathObj, cx, cy, r, t, flip=false){
    // 面：半透明の紙・膜のような質感
    const g = ctx.createRadialGradient(
      cx + Math.cos(t*.10+(flip?1.4:0))*r*.22,
      cy + Math.sin(t*.08+(flip?.5:0))*r*.18,
      r*.08,
      cx,cy,r*1.2
    );
    g.addColorStop(0, 'rgba(95,90,82,.08)');
    g.addColorStop(.48,'rgba(85,82,76,.16)');
    g.addColorStop(.78,'rgba(35,35,35,.34)');
    g.addColorStop(1,'rgba(115,108,98,.09)');

    ctx.fillStyle = g;
    ctx.fill(pathObj.band);

    // 細い輪郭線
    ctx.lineWidth = 1.15;
    ctx.strokeStyle = 'rgba(28,28,28,.82)';
    ctx.stroke(pathObj.center);

    // ごく弱いぼかしの影
    ctx.save();
    ctx.globalAlpha = .13;
    ctx.filter = 'blur(4px)';
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#6e675d';
    ctx.stroke(pathObj.center);
    ctx.restore();
  }

  let last=performance.now();
  let t=0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(now){
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0,0,w,h);

    // 背景
    const bg = ctx.createRadialGradient(w*.50,h*.47,10,w*.50,h*.50,w*.62);
    bg.addColorStop(0,'#fff');
    bg.addColorStop(.65,'#faf9f6');
    bg.addColorStop(1,'#f0efeb');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,w,h);

    // 淡いホログラム
    ctx.save();
    ctx.globalCompositeOperation='screen';
    const holo = ctx.createConicGradient(t*.025, w*.5, h*.5);
    holo.addColorStop(0,'rgba(120,220,255,.14)');
    holo.addColorStop(.2,'rgba(230,170,255,.10)');
    holo.addColorStop(.42,'rgba(255,218,150,.12)');
    holo.addColorStop(.62,'rgba(150,240,220,.10)');
    holo.addColorStop(.82,'rgba(255,180,210,.10)');
    holo.addColorStop(1,'rgba(120,220,255,.14)');
    ctx.filter='blur(50px)';
    ctx.fillStyle=holo;
    ctx.beginPath();
    ctx.arc(w*.5,h*.5,Math.min(w,h)*.54,0,TAU);
    ctx.fill();
    ctx.restore();

    const s = Math.min(w,h);
    const cx = w/2;
    const cy = h/2;
    const outerR = s*.315;
    const innerR = s*.235;

    const outer = ribbonPath(cx,cy,outerR,0.15,t,outerCfg);
    const inner = ribbonPath(cx,cy,innerR,1.2,t,innerCfg);

    paintRibbon(outer,cx,cy,outerR,t,false);
    paintRibbon(inner,cx,cy,innerR,t,true);

    // 中央の薄い円
    const dotR = s*.038*(1 + Math.sin(t*.32)*.035);
    const dg = ctx.createRadialGradient(cx-dotR*.2,cy-dotR*.25,1,cx,cy,dotR);
    dg.addColorStop(0,'rgba(165,160,150,.16)');
    dg.addColorStop(1,'rgba(125,120,112,.08)');
    ctx.fillStyle=dg;
    ctx.beginPath();
    ctx.arc(cx,cy,dotR,0,TAU);
    ctx.fill();

    if(!reduce){
      const dt=Math.min((now-last)/1000,.05);
      t += dt;
      last=now;
      requestAnimationFrame(frame);
    }
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
