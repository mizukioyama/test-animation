<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>喫茶いとま Layout Preview</title>

  <link rel="stylesheet" href="nav.css">

  <style>
    :root {
      --bg-txt01: #3f342d;
      --bg-txt02: #f4efe7;
      --btn-color02: #e8dfd3;
      --color-border: rgba(63, 52, 45, .25);
      --color-current: #9a6f4d;
      --duration: .3s;
      --header-height: 72px;
      --fv-ttl-font: serif;
      --footer-btn-font: serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-width: 320px;
      font-family: sans-serif;
      background: #fff;
    }

    a {
      color: inherit;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .preview-main {
      min-height: 80vh;
      padding: 120px 20px 64px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .preview-main p {
      line-height: 1.8;
    }

    .inst-icon {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div id="header-component"></div>

  <main class="preview-main">
    <div>
      <h1>Header / Footer Layout Preview</h1>
      <p>376〜1335px：Headerはハンバーガー表示</p>
      <p>376〜1335px：FooterはPCレイアウト維持</p>
    </div>
  </main>

  <div id="footer-component"></div>

  <script>
    const loadComponent = async (selector, path) => {
      const target = document.querySelector(selector);
      if (!target) return;

      try {
        const response = await fetch(path);

        if (!response.ok) {
          throw new Error(`${path} の読み込みに失敗しました。status: ${response.status}`);
        }

        target.innerHTML = await response.text();
      } catch (error) {
        console.error(error);
      }
    };

    const initDrawer = () => {
      const header = document.querySelector('.header');
      const hamburger = document.querySelector('.js-hamburger');
      const drawer = document.querySelector('.js-drawer');

      if (!header || !hamburger || !drawer) return;

      const setDrawer = (isOpen) => {
        header.classList.toggle('is-open', isOpen);
        hamburger.classList.toggle('is-open', isOpen);
        drawer.classList.toggle('is-open', isOpen);
        document.body.classList.toggle('is-lock', isOpen);

        hamburger.setAttribute('aria-expanded', String(isOpen));
        hamburger.setAttribute(
          'aria-label',
          isOpen ? 'メニューを閉じる' : 'メニューを開く'
        );
        drawer.setAttribute('aria-hidden', String(!isOpen));
      };

      hamburger.addEventListener('click', () => {
        setDrawer(!hamburger.classList.contains('is-open'));
      });

      drawer.addEventListener('click', (event) => {
        if (event.target.closest('a')) {
          setDrawer(false);
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          setDrawer(false);
        }
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth >= 1336) {
          setDrawer(false);
        }
      });
    };

    const initLayout = async () => {
      await Promise.all([
        loadComponent('#header-component', './header.html'),
        loadComponent('#footer-component', './footer.html')
      ]);

      initDrawer();
    };

    document.addEventListener('DOMContentLoaded', initLayout);
  </script>
</body>
</html>
