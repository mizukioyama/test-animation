    <script defer>
'use strict';


/* ========================================
 * Component
 *======================================== */

const loadComponent = async (selector, path) => {
  const target = document.querySelector(selector);

  if (!target) return;

  try {
    const response = await fetch(path);

    if (!response.ok) {
      throw new Error(
        `${path} の読み込みに失敗しました。status: ${response.status}`
      );
    }

    const html = await response.text();
    target.innerHTML = html;

  } catch (error) {
    console.error(error);
  }
};


/* ========================================
 * Drawer Menu
 *======================================== */

const initDrawer = () => {
  const header = document.querySelector('.header');
  const hamburger = document.querySelector('.js-hamburger');
  const drawer = document.querySelector('.js-drawer');

  if (!header || !hamburger || !drawer) return;


  /* ------------------------------
   * Drawer Close
   *------------------------------ */

  const closeDrawer = () => {
    hamburger.classList.remove('is-open');
    drawer.classList.remove('is-open');
    header.classList.remove('is-open');

    document.body.classList.remove('is-lock');

    hamburger.setAttribute(
      'aria-expanded',
      'false'
    );

    hamburger.setAttribute(
      'aria-label',
      'メニューを開く'
    );

    drawer.setAttribute(
      'aria-hidden',
      'true'
    );
  };


  /* ------------------------------
   * Hamburger Click
   *------------------------------ */

  hamburger.addEventListener('click', () => {
    const isOpen =
      hamburger.classList.toggle('is-open');

    drawer.classList.toggle(
      'is-open',
      isOpen
    );

    header.classList.toggle(
      'is-open',
      isOpen
    );

    document.body.classList.toggle(
      'is-lock',
      isOpen
    );

    hamburger.setAttribute(
      'aria-expanded',
      String(isOpen)
    );

    hamburger.setAttribute(
      'aria-label',
      isOpen
        ? 'メニューを閉じる'
        : 'メニューを開く'
    );

    drawer.setAttribute(
      'aria-hidden',
      String(!isOpen)
    );
  });


  /* ------------------------------
   * Drawer Link Click
   *------------------------------ */

  drawer
    .querySelectorAll('.js-drawer-link, .nav__link')
    .forEach((link) => {

      link.addEventListener(
        'click',
        closeDrawer
      );

    });


  /* ------------------------------
   * Escape Key
   *------------------------------ */

  document.addEventListener(
    'keydown',
    (event) => {

      if (event.key !== 'Escape') return;

      const isOpen =
        hamburger.getAttribute(
          'aria-expanded'
        ) === 'true';

      if (!isOpen) return;

      closeDrawer();

      hamburger.focus();
    }
  );


  /* ------------------------------
   * PCに切り替わったらDrawerを閉じる
   *------------------------------ */

  const pcMedia =
    window.matchMedia(
      '(min-width: 1024px)'
    );

  pcMedia.addEventListener(
    'change',
    (event) => {

      if (event.matches) {
        closeDrawer();
      }

    }
  );
};


/* ========================================
 * Mobile Header Scroll
 *
 * スマホのみ
 * ページ全体の60%地点で追尾終了
 *======================================== */

const initMobileHeaderScroll = () => {
  const header =
    document.querySelector('.header');

  if (!header) return;


  const mobileMedia =
    window.matchMedia(
      '(max-width: 767px)'
    );


  let ticking = false;


  /* ------------------------------
   * Header Position Update
   *------------------------------ */

  const updateHeader = () => {

    /*
     * 768px以上では通常のfixed
     */
    if (!mobileMedia.matches) {

      header.classList.remove(
        'is-scroll-stop'
      );

      header.style.removeProperty(
        '--header-stop-position'
      );

      return;
    }


    /*
     * Drawer展開中は
     * Header追尾停止判定を行わない
     */
    if (header.classList.contains('is-open')) {
      return;
    }


    const scrollTop =
      window.scrollY ||
      document.documentElement.scrollTop;


    /*
     * 実際にスクロール可能な距離
     */
    const maxScroll =
      document.documentElement.scrollHeight -
      window.innerHeight;


    /*
     * スクロールできないページ
     */
    if (maxScroll <= 0) {

      header.classList.remove(
        'is-scroll-stop'
      );

      header.style.removeProperty(
        '--header-stop-position'
      );

      return;
    }


    /*
     * ページ全体の60%
     */
    const stopPosition =
      maxScroll * 0.6;


    /*
     * 60%以上
     */
    if (scrollTop >= stopPosition) {

      header.style.setProperty(
        '--header-stop-position',
        `${stopPosition}px`
      );

      header.classList.add(
        'is-scroll-stop'
      );

    } else {

      /*
       * 60%未満に戻ったら
       * 再度fixed
       */
      header.classList.remove(
        'is-scroll-stop'
      );

      header.style.removeProperty(
        '--header-stop-position'
      );

    }
  };


  /* ------------------------------
   * Scroll
   *------------------------------ */

  const handleScroll = () => {

    if (ticking) return;

    ticking = true;

    window.requestAnimationFrame(() => {

      updateHeader();

      ticking = false;

    });
  };


  /* ------------------------------
   * Events
   *------------------------------ */

  window.addEventListener(
    'scroll',
    handleScroll,
    {
      passive: true
    }
  );


  window.addEventListener(
    'resize',
    updateHeader
  );


  window.addEventListener(
    'load',
    updateHeader
  );


  mobileMedia.addEventListener(
    'change',
    updateHeader
  );


  /*
   * 初期状態
   */
  updateHeader();
};


/* ========================================
 * Footer Year
 *======================================== */

const initFooterYear = () => {
  const year =
    document.querySelector('.js-year');

  if (!year) return;

  year.textContent =
    new Date().getFullYear();
};


/* ========================================
 * Init
 *======================================== */

const initLayout = async () => {

  /*
   * Header / Footer読み込み
   */
  await Promise.all([

    loadComponent(
      '#header-component',
      './header.html'
    ),

    loadComponent(
      '#footer-component',
      './footer.html'
    )

  ]);


  /*
   * Component読み込み完了後
   */
  initDrawer();
  initFooterYear();
  initMobileHeaderScroll();
};


/* ========================================
 * DOM Ready
 *======================================== */

if (document.readyState === 'loading') {

  document.addEventListener(
    'DOMContentLoaded',
    initLayout
  );

} else {

  initLayout();

}
